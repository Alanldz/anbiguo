# =============================================================================
# api 站点 · Laravel 主应用（客户端 API + 用户后台 API）
# 宝塔操作：网站 → 添加站点（根目录 /www/wwwroot/anbiguo/server/public，纯静态）
#          → 设置 → 配置文件 → 用本文件内容替换（替换域名；PHP 版本按实际改 sock）
# =============================================================================
server {
    listen 80;
    listen 443 ssl http2;
    server_name api.anbiguo.com;               # ← 改成你的域名

    # 证书路径（宝塔申请 Let's Encrypt 后自动生成，按实际路径改）
    # ssl_certificate    /www/server/panel/vhost/cert/api.anbiguo.com/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/api.anbiguo.com/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;

    root /www/wwwroot/anbiguo/server/public;
    index index.php index.html;
    charset utf-8;
    client_max_body_size 50m;                  # 导入文档上传上限

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/tmp/php-cgi-83.sock;   # ← 与宝塔 PHP 8.3 的 sock 路径一致
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # 静态资源缓存（public/build 之外的本地存储文件）
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff2?)$ {
        expires 7d;
        access_log off;
    }

    # 禁止访问隐藏文件与敏感文件
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(env|md|sql|lock)$ { deny all; }

    access_log /www/wwwlogs/api.anbiguo.com.log;
    error_log  /www/wwwlogs/api.anbiguo.com.error.log;
}
