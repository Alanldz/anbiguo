# =============================================================================
# console 站点 · 用户后台前端（静态）+ /console-api 反代到本机 api 站点
# 宝塔操作：网站 → 添加站点（根目录 /www/wwwroot/anbiguo/console/web/dist，纯静态）
#          → 设置 → 配置文件 → 用本文件内容替换（替换域名）
# 说明：console/web 构建时 VITE_API_BASE=/console-api/v1，
#      所以 /console-api 必须回源到主应用（同一台机器，走 127.0.0.1:80 + Host 头）
# =============================================================================
server {
    listen 80;
    listen 443 ssl http2;
    server_name console.anbiguo.com;           # ← 改成你的域名

    # ssl_certificate     /www/server/panel/vhost/cert/console.anbiguo.com/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/console.anbiguo.com/privkey.pem;

    root /www/wwwroot/anbiguo/console/web/dist;
    index index.html;
    charset utf-8;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 用户后台接口回源到主应用（本机）
    location /console-api/ {
        proxy_pass http://127.0.0.1:80;
        proxy_set_header Host api.anbiguo.com;    # ← 与 api 站点域名一致
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        access_log off;
    }

    access_log /www/wwwlogs/console.anbiguo.com.log;
}
