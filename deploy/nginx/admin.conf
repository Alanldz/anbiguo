# =============================================================================
# admin 站点 · 总后台前端（静态）+ /admin-api 反代到本机 admin/api 应用
# 宝塔操作：网站 → 添加站点（根目录 /www/wwwroot/anbiguo/admin/web/dist，纯静态）
#          → 设置 → 配置文件 → 用本文件内容替换（替换域名）
# 说明：admin/api 是独立 Laravel 应用（无独立域名），由本站点反代 /admin-api/*
#      到本机。反代走 127.0.0.1:81 端口 = 下面第二个 server 块（admin/api 专用入口）。
# =============================================================================
# —— ① 前端静态站点（对外）——
server {
    listen 80;
    listen 443 ssl http2;
    server_name admin.anbiguo.com;             # ← 改成你的域名

    # ssl_certificate     /www/server/panel/vhost/cert/admin.anbiguo.com/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/admin.anbiguo.com/privkey.pem;

    root /www/wwwroot/anbiguo/admin/web/dist;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 总后台接口 → 本机 81 端口的 admin/api 专用入口
    location /admin-api/ {
        proxy_pass http://127.0.0.1:81;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        access_log off;
    }

    access_log /www/wwwlogs/admin.anbiguo.com.log;
}

# —— ② admin/api 应用入口（只监听本机回环，不对外）——
server {
    listen 127.0.0.1:81;
    server_name _;

    root /www/wwwroot/anbiguo/admin/api/public;
    index index.php;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/tmp/php-cgi-83.sock;   # ← 与宝塔 PHP 8.3 的 sock 路径一致
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(env|md|sql|lock)$ { deny all; }
}
