# =============================================================================
# h5 站点 · 客户端 H5 静态站（hash 路由，无需 history 回退）
# 宝塔操作：网站 → 添加站点（根目录 /www/wwwroot/anbiguo/client/dist/build/h5，纯静态）
# 说明：H5 当前为 Mock 数据演示态；联调切换真实 API 时，
#      在 client/src/api/index.ts 把 USE_MOCK 改为 false 并重新 build:h5 上传。
# =============================================================================
server {
    listen 80;
    listen 443 ssl http2;
    server_name h5.anbiguo.com;                # ← 改成你的域名

    # ssl_certificate     /www/server/panel/vhost/cert/h5.anbiguo.com/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/h5.anbiguo.com/privkey.pem;

    root /www/wwwroot/anbiguo/client/dist/build/h5;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 若 H5 联调真实接口（同域反代，避免 CORS）
    location /api/ {
        proxy_pass http://127.0.0.1:80;
        proxy_set_header Host api.anbiguo.com;    # ← 与 api 站点域名一致
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        access_log off;
    }

    access_log /www/wwwlogs/h5.anbiguo.com.log;
}
